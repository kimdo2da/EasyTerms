# Railway Spring Boot + Railway MySQL (profile: prod)
# Local application.properties remains unchanged and must not be uploaded if it contains secrets.
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?connectionTimeZone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-6-luna
app.jwt.secret-base64=${JWT_SECRET_BASE64}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-stacktrace=never
server.error.include-message=never
